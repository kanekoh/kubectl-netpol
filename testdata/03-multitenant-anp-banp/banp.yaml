apiVersion: policy.networking.k8s.io/v1alpha1
kind: BaselineAdminNetworkPolicy
metadata:
  name: default
spec:
  subject:
    namespaces: {}
  egress:
  - name: deny-external-egress-ipv4
    action: Deny
    to:
    - networks:
      - "0.0.0.0/0"
  - name: deny-external-egress-ipv6
    action: Deny
    to:
    - networks:
      - "::/0"
