name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm64
          - goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          OUT="dist/kubectl-netpol_${VERSION}_darwin_${GOARCH}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "${OUT}" .
          chmod +x "${OUT}"
          (
            cd dist
            BIN="$(basename "${OUT}")"
            ln -sf "${BIN}" oc-netpol
            tar czf "kubectl-netpol_${VERSION}_darwin_${GOARCH}.tar.gz" "${BIN}" oc-netpol
            rm -f oc-netpol
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubectl-netpol-darwin-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
